# Runs on a self-hosted cid-runner on the owner's machine.
# Set on the runner before starting it:
#   HL1_GC_DIR             xash3d-gc checkout path (default: .)
#   HL1_GC_BUILD_COMMAND   GameCube build command (optional; defaults to ./scripts/build-gamecube.sh)
#   HL1_GC_TEST_COMMAND    Dolphin probe command (optional; defaults to true, so only the build runs)
schema_version: "1"
name: half-life1-gamecube
triggers:
  - type: manual
  - type: push
    config:
      branches: [master]
steps:
  - name: toolchain-preflight
    type: lint
    config:
      command: >-
        test -f "${HL1_GC_DIR:-.}/scripts/build-gamecube.sh" || { echo "scripts/build-gamecube.sh not found" >&2; exit 2; };
        echo "GameCube toolchain adapter configured"
      timeout_seconds: 60
  - name: build-xash3d-gamecube
    type: build
    depends_on: [toolchain-preflight]
    config:
      working_dir: "${HL1_GC_DIR:-.}"
      command: "${HL1_GC_BUILD_COMMAND:-./scripts/build-gamecube.sh}"
      timeout_seconds: 3600
  - name: probe-new-game
    type: test
    depends_on: [build-xash3d-gamecube]
    config:
      working_dir: "${HL1_GC_DIR:-.}"
      command: "${HL1_GC_TEST_COMMAND:-true}"
      timeout_seconds: 1800
metadata:
  description: "xash3d-gc GameCube build and Dolphin New Game probe"
  owner: "timfox"
